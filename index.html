<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pengurusan Anggota PU Kuching</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      background-color: #08101d;
      background-image: 
        linear-gradient(to right, rgba(8, 16, 29, 0.4) 0%, rgba(8, 16, 29, 0.95) 30%, rgba(8, 16, 29, 0.95) 70%, rgba(8, 16, 29, 0.4) 100%),
        url('bg.jpeg'),
        url('bg.jpeg');
      background-position: left center, right center;
      background-repeat: no-repeat, no-repeat;
      background-size: auto 100%, auto 100%;
      background-attachment: fixed;
    }
    .card {
      background-color: rgba(15, 27, 45, 0.95);
      border: 1px solid #1e3a5f;
      border-radius: 14px;
      padding: 22px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 1;
    }
    .header-box {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-box img {
      width: 95px;
      height: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }
    .header-box h2 {
      color: #38bdf8;
      margin: 0;
      font-size: 1.15rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .header-box p {
      color: #94a3b8;
      margin: 4px 0 0 0;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tabs button {
      flex: 1;
      padding: 10px;
      background-color: #1e2e47;
      color: #94a3b8;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .tabs button.active {
      background-color: #0284c7;
      color: white;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .section-title {
      font-size: 0.82rem;
      font-weight: bold;
      color: #38bdf8;
      border-bottom: 1px solid #1e3a5f;
      padding-bottom: 4px;
      margin-top: 15px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    label {
      font-size: 0.78rem;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
      margin-top: 8px;
    }
    input, select, textarea {
      width: 100%;
      padding: 9px;
      background-color: #091322;
      border: 1px solid #243b5a;
      border-radius: 6px;
      color: white;
      box-sizing: border-box;
      font-size: 0.9rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0284c7;
    }
    .auto-field {
      background-color: #1a273a;
      color: #38bdf8;
      font-weight: bold;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-mka { background-color: #0284c7; color: white; }
    .btn-kka { background-color: #e11d48; color: white; }
    .status-msg {
      text-align: center;
      margin-top: 12px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-box">
      <img src="logo.png" alt="Logo PU Kuching" onerror="this.style.display='none'">
      <h2>Pangkalan Udara Kuching</h2>
      <p>Sistem Pengurusan Kekuatan Anggota</p>
    </div>

    <div class="tabs">
      <button id="btnMKA" class="active" onclick="switchMod('MKA')">MKA (Lapor Masuk)</button>
      <button id="btnKKA" onclick="switchMod('KKA')">KKA (Lapor Keluar)</button>
    </div>

    <!-- ==================== BORANG MKA ==================== -->
    <div id="formMKA" class="tab-content active">
      
      <div class="section-title">1. Penempatan & Perkhidmatan</div>
      <label>SKN / CWG PENEMPATAN:</label>
      <select id="mkaTargetTab">
        <option value="NO 1 SKN">NO 1 SKN</option>
        <option value="SKN 330">SKN 330</option>
        <option value="DETCH 3 SKN">DETCH 3 SKN</option>
        <option value="CWG KEJURUTERAAN">CWG KEJURUTERAAN</option>
        <option value="CWG OPERASI">CWG OPERASI</option>
        <option value="CWG MATERIEL">CWG MATERIEL</option>
        <option value="CWG TADBIR">CWG TADBIR</option>
        <option value="SKN 215 HANDAU">SKN 215 HANDAU</option>
        <option value="CWG BOMBA">CWG BOMBA</option>
      </select>

      <div class="grid-2">
        <div>
          <label>NO TEN:</label>
          <input type="text" id="mkaNoTen" placeholder="Contoh: 372494">
        </div>
        <div>
          <label>PKT:</label>
          <input type="text" id="mkaPkt" placeholder="Contoh: SJN U">
        </div>
      </div>

      <label>NAMA:</label>
      <input type="text" id="mkaNama" placeholder="NAMA PENUH">

      <div class="grid-2">
        <div>
          <label>MKA (Tarikh Masuk):</label>
          <input type="date" id="mkaTarikh">
        </div>
        <div>
          <label>TRED:</label>
          <input type="text" id="mkaTred" placeholder="Ketukangan / Tred">
        </div>
      </div>

      <div class="section-title">2. Maklumat Peribadi</div>
      <label>NO KP (ANGGOTA):</label>
      <input type="text" id="mkaNoKp" placeholder="Contoh: 900202-03-2563" oninput="prosesKadPengenalan(this.value)">

      <div class="grid-3">
        <div>
          <label>BANGSA:</label>
          <input type="text" id="mkaBangsa" placeholder="Melayu/Iban dll">
        </div>
        <div>
          <label>AGAMA:</label>
          <input type="text" id="mkaAgama" placeholder="Islam/Kristian">
        </div>
        <div>
          <label>STATUS:</label>
          <input type="text" id="mkaStatus" placeholder="Kahwin/Bujang">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>TARIKH LAHIR (Auto):</label>
          <input type="date" id="mkaTarikhLahir" onchange="kiraUmur(this.value)">
        </div>
        <div>
          <label>UMUR (TAHUN):</label>
          <input type="number" id="mkaUmur" class="auto-field" placeholder="Auto" readonly>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>TMP:</label>
          <input type="date" id="mkaTmp">
        </div>
        <div>
          <label>TTP:</label>
          <input type="date" id="mkaTtp">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>UNIT INSURAN:</label>
          <input type="text" id="mkaUnitInsuran" placeholder="Contoh: Takaful/Tiada">
        </div>
        <div>
          <label>NO AHLI INSURAN:</label>
          <input type="text" id="mkaNoAhliInsuran" placeholder="No Polisi / Ahli">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>NO TELEFON:</label>
          <input type="text" id="mkaNoTel" placeholder="01X-XXXXXXX">
        </div>
        <div>
          <label>EMAIL PERSONAL:</label>
          <input type="email" id="mkaEmailPersonal" placeholder="emel@gmail.com">
        </div>
      </div>

      <div class="section-title">3. Maklumat Undi (SPR)</div>
      <div class="grid-2">
        <div>
          <label>DAERAH MENGUNDI:</label>
          <input type="text" id="mkaDaerahMengundi" placeholder="Daerah">
        </div>
        <div>
          <label>DUN:</label>
          <input type="text" id="mkaDun" placeholder="DUN">
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label>PARLIMEN:</label>
          <input type="text" id="mkaParlimen" placeholder="Parlimen">
        </div>
        <div>
          <label>NEGERI:</label>
          <input type="text" id="mkaNegeri" placeholder="Negeri">
        </div>
      </div>

      <div class="section-title">4. Maklumat Waris & Keluarga</div>
      <label>NAMA WARIS:</label>
      <input type="text" id="mkaNamaWaris" placeholder="Nama waris">

      <div class="grid-2">
        <div>
          <label>HUBUNGAN:</label>
          <input type="text" id="mkaHubunganWaris" placeholder="Isteri/Ibu/Bapa">
        </div>
        <div>
          <label>PEKERJAAN:</label>
          <input type="text" id="mkaPekerjaanWaris" placeholder="Pekerjaan waris">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>NO K/P (WARIS):</label>
          <input type="text" id="mkaNoKpWaris" placeholder="No KP Waris">
        </div>
        <div>
          <label>NO TEL (WARIS):</label>
          <input type="text" id="mkaNoTelWaris" placeholder="No Tel Waris">
        </div>
      </div>

      <label>ALAMAT WARIS:</label>
      <textarea id="mkaAlamatWaris" rows="2" placeholder="Alamat kediaman waris"></textarea>

      <label>BIL ANAK:</label>
      <input type="number" id="mkaBilAnak" placeholder="Contoh: 0 / 1 / 2">

      <button class="btn-submit btn-mka" onclick="hantarMKA()">MASUK KEKUATAN (MKA)</button>
      <div id="statusMKA" class="status-msg"></div>
    </div>

    <!-- ==================== BORANG KKA ==================== -->
    <div id="formKKA" class="tab-content">
      <div class="section-title">Lapor Keluar Anggota (KKA)</div>
      <p style="font-size:0.82rem; color:#94a3b8; line-height:1.4;">
        Masukkan <strong>NO TEN</strong> dan tekan butang <strong>CARI</strong> untuk mendapatkan maklumat anggota secara automatik.
      </p>

      <label>NO TEN (WAJIB):</label>
      <div style="display:flex; gap:6px;">
        <input type="text" id="kkaNoTen" placeholder="Masukkan No Tentera">
        <button type="button" onclick="cariDataKKA()" style="width:90px; background:#0284c7; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">CARI</button>
      </div>

      <div class="grid-2">
        <div>
          <label>PKT:</label>
          <input type="text" id="kkaPkt" class="auto-field" placeholder="Pangkat" readonly>
        </div>
        <div>
          <label>SKN / CWG:</label>
          <input type="text" id="kkaUnitAsal" class="auto-field" placeholder="Unit Asal" readonly>
        </div>
      </div>

      <label>NAMA:</label>
      <input type="text" id="kkaNama" class="auto-field" placeholder="Nama Penuh" readonly>

      <div class="grid-2">
        <div>
          <label>NO TELEFON:</label>
          <input type="text" id="kkaNoTel" class="auto-field" placeholder="No Telefon" readonly>
        </div>
        <div>
          <label>TARIKH KKA (WAJIB):</label>
          <input type="date" id="kkaTarikh">
        </div>
      </div>

      <label>UNIT BARU (WAJIB):</label>
      <input type="text" id="kkaUnitBaru" placeholder="Contoh: MTU / PU Butterworth / Rejimen dll">

      <button class="btn-submit btn-kka" onclick="hantarKKA()">SAHKAN KELUAR KEKUATAN (KKA)</button>
      <div id="statusKKA" class="status-msg"></div>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxZyO-6mvKI5slXGMix03U2I7FK545NGeqvvVJJLbd8VTaw0IhooCN-iK2JsdpQseE1CQ/exec";

    // 1. Ekstrak Tarikh Lahir & Kira Umur secara automatik dari No KP
    function prosesKadPengenalan(ic) {
      const cleanIC = ic.replace(/[^0-9]/g, '');
      if (cleanIC.length >= 6) {
        let yr = parseInt(cleanIC.substring(0, 2), 10);
        const mm = cleanIC.substring(2, 4);
        const dd = cleanIC.substring(4, 6);

        const currentShortYear = new Date().getFullYear() % 100;
        const fullYear = (yr <= currentShortYear) ? (2000 + yr) : (1900 + yr);

        const tarikhLahirStr = `${fullYear}-${mm}-${dd}`;
        document.getElementById("mkaTarikhLahir").value = tarikhLahirStr;
        kiraUmur(tarikhLahirStr);
      }
    }

    function kiraUmur(tarikhStr) {
      if (!tarikhStr) return;
      const tLahir = new Date(tarikhStr);
      const hariIni = new Date();
      let umur = hariIni.getFullYear() - tLahir.getFullYear();
      const perbezaanBulan = hariIni.getMonth() - tLahir.getMonth();
      if (perbezaanBulan < 0 || (perbezaanBulan === 0 && hariIni.getDate() < tLahir.getDate())) {
        umur--;
      }
      if (umur >= 0 && umur < 120) {
        document.getElementById("mkaUmur").value = umur;
      }
    }

    function switchMod(mod) {
      document.getElementById("formMKA").classList.remove("active");
      document.getElementById("formKKA").classList.remove("active");
      document.getElementById("btnMKA").classList.remove("active");
      document.getElementById("btnKKA").classList.remove("active");

      if (mod === "MKA") {
        document.getElementById("formMKA").classList.add("active");
        document.getElementById("btnMKA").classList.add("active");
      } else {
        document.getElementById("formKKA").classList.add("active");
        document.getElementById("btnKKA").classList.add("active");
      }
    }

    // 2. Fungsi Hantar MKA
    async function hantarMKA() {
      const statusBox = document.getElementById("statusMKA");
      const noTen = document.getElementById("mkaNoTen").value.trim();
      const nama = document.getElementById("mkaNama").value.trim();

      if (!noTen || !nama) {
        statusBox.innerHTML = "<span style='color:#f87171;'>Sila lengkapkan sekurang-kurangnya No Tentera dan Nama!</span>";
        return;
      }

      statusBox.innerHTML = "<span style='color:#38bdf8;'>Sedang mendaftarkan maklumat...</span>";

      const payload = {
        action: "MKA",
        targetTab: document.getElementById("mkaTargetTab").value,
        noTentera: noTen,
        pangkat: document.getElementById("mkaPkt").value.trim(),
        nama: nama,
        mka: document.getElementById("mkaTarikh").value,
        tred: document.getElementById("mkaTred").value.trim(),
        noKpAnggota: document.getElementById("mkaNoKp").value.trim(),
        bangsa: document.getElementById("mkaBangsa").value.trim(),
        agama: document.getElementById("mkaAgama").value.trim(),
        statusKahwin: document.getElementById("mkaStatus").value.trim(),
        tarikhLahir: document.getElementById("mkaTarikhLahir").value,
        umur: document.getElementById("mkaUmur").value.trim(),
        tmp: document.getElementById("mkaTmp").value,
        ttp: document.getElementById("mkaTtp").value,
        unitInsuran: document.getElementById("mkaUnitInsuran").value.trim(),
        noAhliInsuran: document.getElementById("mkaNoAhliInsuran").value.trim(),
        noTel: document.getElementById("mkaNoTel").value.trim(),
        daerahMengundi: document.getElementById("mkaDaerahMengundi").value.trim(),
        dun: document.getElementById("mkaDun").value.trim(),
        parlimen: document.getElementById("mkaParlimen").value.trim(),
        negeri: document.getElementById("mkaNegeri").value.trim(),
        namaWaris: document.getElementById("mkaNamaWaris").value.trim(),
        hubunganWaris: document.getElementById("mkaHubunganWaris").value.trim(),
        pekerjaanWaris: document.getElementById("mkaPekerjaanWaris").value.trim(),
        noKpWaris: document.getElementById("mkaNoKpWaris").value.trim(),
        alamatWaris: document.getElementById("mkaAlamatWaris").value.trim(),
        noTelWaris: document.getElementById("mkaNoTelWaris").value.trim(),
        bilAnak: document.getElementById("mkaBilAnak").value.trim(),
        emailPersonal: document.getElementById("mkaEmailPersonal").value.trim()
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === "success") {
          statusBox.innerHTML = `<span style='color:#4ade80;'>${result.message}</span>`;
          document.getElementById("mkaNoTen").value = "";
          document.getElementById("mkaNama").value = "";
        } else {
          statusBox.innerHTML = `<span style='color:#f87171;'>${result.message}</span>`;
        }
      } catch (err) {
        statusBox.innerHTML = "<span style='color:#f87171;'>Ralat semasa menghantar data.</span>";
      }
    }

    // 3. Fungsi Cari Data Anggota untuk KKA
    async function cariDataKKA() {
      const statusBox = document.getElementById("statusKKA");
      const noTen = document.getElementById("kkaNoTen").value.trim();

      if (!noTen) {
        statusBox.innerHTML = "<span style='color:#f87171;'>Sila masukkan No Tentera dahulu!</span>";
        return;
      }

      statusBox.innerHTML = "<span style='color:#38bdf8;'>Mencari rekod...</span>";

      try {
        const res = await fetch(`${API_URL}?action=CARI_ANGGOTA&noTentera=${encodeURIComponent(noTen)}`);
        const result = await res.json();

        if (result.status === "success") {
          document.getElementById("kkaPkt").value = result.data.pangkat || "";
          document.getElementById("kkaNama").value = result.data.nama || "";
          document.getElementById("kkaUnitAsal").value = result.data.unit || "";
          document.getElementById("kkaNoTel").value = result.data.noTel || "";
          statusBox.innerHTML = `<span style='color:#4ade80;'>Rekod ditemui dari ${result.data.unit}!</span>`;
        } else {
          statusBox.innerHTML = `<span style='color:#f87171;'>Rekod tidak ditemui dalam pangkalan data!</span>`;
          document.getElementById("kkaPkt").value = "";
          document.getElementById("kkaNama").value = "";
          document.getElementById("kkaUnitAsal").value = "";
          document.getElementById("kkaNoTel").value = "";
        }
      } catch (err) {
        statusBox.innerHTML = "<span style='color:#f87171;'>Ralat semasa mencari rekod.</span>";
      }
    }

    // 4. Fungsi Hantar KKA
    async function hantarKKA() {
      const statusBox = document.getElementById("statusKKA");
      const noTen = document.getElementById("kkaNoTen").value.trim();
      const tarikhKKA = document.getElementById("kkaTarikh").value;
      const unitBaru = document.getElementById("kkaUnitBaru").value.trim();

      if (!noTen || !tarikhKKA || !unitBaru) {
        statusBox.innerHTML = "<span style='color:#f87171;'>Sila lengkapkan NO TEN, TARIKH KKA, dan UNIT BARU!</span>";
        return;
      }

      statusBox.innerHTML = "<span style='color:#38bdf8;'>Sedang memindahkan rekod ke KKA...</span>";

      const payload = {
        action: "KKA",
        noTentera: noTen,
        tarikhKKA: tarikhKKA,
        unitBaru: unitBaru
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === "success") {
          statusBox.innerHTML = `<span style='color:#4ade80;'>${result.message}</span>`;
          document.getElementById("kkaNoTen").value = "";
          document.getElementById("kkaPkt").value = "";
          document.getElementById("kkaNama").value = "";
          document.getElementById("kkaUnitAsal").value = "";
          document.getElementById("kkaNoTel").value = "";
          document.getElementById("kkaUnitBaru").value = "";
        } else {
          statusBox.innerHTML = `<span style='color:#f87171;'>${result.message}</span>`;
        }
      } catch (err) {
        statusBox.innerHTML = "<span style='color:#f87171;'>Ralat sambungan.</span>";
      }
    }
  </script>
</body>
</html>
